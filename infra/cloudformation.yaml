AWSTemplateFormatVersion: "2010-09-09"
Description: Secure baseline infrastructure for the yield-forecasting SageMaker workload

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ModelPackageName:
    Type: String
    Default: yield-forecasting

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: aws:kms}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 90}

  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: sagemaker.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scoped-artifact-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: [cloudwatch:PutMetricData, logs:CreateLogStream, logs:PutLogEvents, logs:CreateLogGroup]
                Resource: "*"

  ModelQualityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Yield model MAE exceeded its approved operating threshold
      Namespace: YieldForecasting
      MetricName: GrossYieldMAE
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0.006
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching

  DriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Maximum feature PSI is critical
      Namespace: YieldForecasting
      MetricName: MaximumPSI
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  ExecutionRoleArn:
    Value: !GetAtt SageMakerExecutionRole.Arn

