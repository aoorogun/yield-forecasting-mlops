[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yield-forecasting-mlops"
version = "1.0.0"
description = "Production-style yield forecasting and dynamic decision reforecasting reference project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
deep-learning = ["torch>=2.2,<3"]
aws = ["boto3>=1.34,<2", "sagemaker>=2.210,<3"]
dev = ["pytest>=8,<9", "ruff>=0.4,<1", "mypy>=1.10,<2", "httpx>=0.27,<1"]

[project.scripts]
yield-forecast = "yield_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

